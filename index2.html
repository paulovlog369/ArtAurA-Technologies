<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArtAurA</title>
<style>
body{margin:0;background:#050508;color:white;font-family:sans-serif}
.topo{background:#0a0a0f;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;position:sticky;top:0;z-index:100}
.topo img{height:32px}
#check{display:none}
.hamburger{font-size:30px;color:#d4af37;cursor:pointer;user-select:none}
#abas{position:fixed;top:0;right:-100%;width:75%;height:100vh;background:#111;padding:70px 25px;transition:0.3s;z-index:99}
#check:checked ~ #abas{right:0}
#check:checked ~ #fundo{display:block}
#abas a{display:block;color:white;text-decoration:none;padding:16px 0;border-bottom:1px solid #222;font-size:18px}
#fundo{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(0,0,0,0.6);display:none;z-index:98}
.hero{height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.hero img{width:85%;max-width:400px}
.btn{padding:14px 28px;border-radius:12px;text-decoration:none;font-weight:bold;background:linear-gradient(90deg,#d4af37,#b8860b);color:black;display:inline-block;margin-top:10px}
</style>
</head>
<body>

<input type="checkbox" id="check">
<div id="fundo"><label for="check" style="display:block;width:100%;height:100vh"></label></div>

<div class="topo">
<img src="logo.webp">
<label for="check" class="hamburger">☰</label>
</div>

<div id="abas">
<label for="check" style="color:#d4af37;display:block;text-align:right;font-size:28px;margin-bottom:20px;cursor:pointer">✕</label>
<a href="index2.html">🏠 Início</a>
<a href="#servicos">💼 Serviços</a>
<a href="projetos.html">📁 Projetos</a>
<a href="calculadora.html">🧮 Calculadora</a>
<a href="contato.html">📱 Contato</a>
</div>

<div class="hero">
<img src="logo.webp">
<p style="color:#aaa;margin:20px 0">Tecnologia que gera confiança</p>
<a class="btn" href="#">Solicitar Orçamento</a>
</div>

</body>
</html>
