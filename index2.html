<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArtAurA</title>
<style>
body{margin:0;background:#050508;color:white;font-family:sans-serif}
.topo{background:#0a0a0f;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
.topo img{height:32px}
.topo button{font-size:28px;background:none;border:none;color:#d4af37}
#abas{position:fixed;top:0;right:-100%;width:75%;height:100vh;background:#111;padding:70px 25px;transition:0.3s;z-index:10}
#abas.mostra{right:0}
#abas a{display:block;color:white;text-decoration:none;padding:16px 0;border-bottom:1px solid #222;font-size:18px}
#fundo{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(0,0,0,0.6);display:none}
#fundo.mostra{display:block}
.hero{height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.hero img{width:85%;max-width:400px}
</style>
</head>
<body>

<div id="fundo" onclick="abrir()"></div>

<div class="topo">
<img src="logo.webp">
<button onclick="abrir()">☰</button>
</div>

<div id="abas">
<a href="index2.html">🏠 Início</a>
<a href="projetos.html">📁 Projetos</a>
<a href="calculadora.html">🧮 Calculadora</a>
<a href="contato.html">📱 Contato</a>
</div>

<div class="hero">
<img src="logo.webp">
<p style="color:#aaa;margin:20px 0">Tecnologia que gera confiança</p>
<a href="#" style="background:linear-gradient(90deg,#d4af37,#b8860b);color:black;padding:14px 28px;border-radius:12px;text-decoration:none;font-weight:bold">Solicitar Orçamento</a>
</div>

<script>
function abrir(){
document.getElementById('abas').classList.toggle('mostra');
document.getElementById('fundo').classList.toggle('mostra');
}
</script>

</body>
</html>
